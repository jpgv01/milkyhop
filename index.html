<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Milky Hop">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#2b1d33">
<title>Milky Hop</title>
<style>
  html, body { margin: 0; height: 100%; background: #2b1d33; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  body { position: fixed; inset: 0; box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display: flex; align-items: center; justify-content: center; font-family: "Trebuchet MS", system-ui, sans-serif; }
  canvas { display: block; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  [hidden] { display: none !important; }

  /* buttons laid over the canvas, positioned in game units (420 x 720) */
  #ui { position: fixed; left: 0; top: 0; width: 420px; height: 720px; transform-origin: 0 0; pointer-events: none; z-index: 4; }
  .ui-btn { position: absolute; pointer-events: auto; font: bold 17px "Trebuchet MS", system-ui, sans-serif; color: #3a2a35; background: #fffaf0;
    border: 3px solid #3a2a35; border-radius: 12px; padding: 0 12px; cursor: pointer; box-shadow: 0 3px 0 #3a2a35; }
  .ui-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #3a2a35; }
  .ui-btn:focus-visible { outline: 3px solid #ffd23f; outline-offset: 2px; }
  #langBtn { left: 12px; top: 12px; height: 38px; min-width: 52px; }
  #closetBtn { left: 50%; transform: translateX(-50%); top: 648px; height: 46px; }
  #closetBtn:active { transform: translateX(-50%) translateY(2px); }
  #shareBtn { left: 50%; transform: translateX(-50%); top: 552px; height: 42px; background: #25d366; color: #fff; white-space: nowrap; }
  #shareBtn:active { transform: translateX(-50%) translateY(2px); }

  .card { background: #fffaf0; border: 4px solid #3a2a35; border-radius: 18px; padding: 14px 16px 16px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
    color: #3a2a35; font-family: "Trebuchet MS", system-ui, sans-serif; display: flex; flex-direction: column; gap: 8px; }
  #lbForm { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    width: min(320px, calc(100vw - 32px)); z-index: 5; margin: 0; }
  .lb-title { margin: 0; font-size: 20px; font-weight: bold; color: #e0457a; text-align: center; }
  .card label { font-size: 14px; font-weight: bold; }
  #lbName { font: bold 22px "Trebuchet MS", system-ui, sans-serif; letter-spacing: 2px; text-transform: uppercase; padding: 8px 10px;
    border: 3px solid #3a2a35; border-radius: 10px; background: #fff; color: #3a2a35; width: 100%; box-sizing: border-box;
    -webkit-user-select: text; user-select: text; }
  #lbName:focus { outline: 3px solid #ffd23f; outline-offset: 1px; }
  .lb-err { margin: 0; min-height: 1em; font-size: 13px; color: #c62839; }
  .lb-row { display: flex; gap: 10px; }
  .lb-row button, #closetDone { flex: 1; font: bold 18px "Trebuchet MS", system-ui, sans-serif; padding: 10px; border-radius: 12px; border: 3px solid #3a2a35; cursor: pointer; color: #3a2a35; }
  #lbSave, #closetDone { background: #ffd23f; }
  #lbSkip { background: #fff; }
  .lb-row button:disabled { opacity: .6; }

  #closet { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(340px, calc(100vw - 32px)); z-index: 6; max-height: calc(100vh - 24px); overflow-y: auto; box-sizing: border-box; }
  #closet h2 { margin: 0; font-size: 22px; color: #e0457a; text-align: center; }
  #closet h3 { margin: 6px 0 0; font-size: 15px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .sw { width: 52px; height: 56px; border: 3px solid #3a2a35; border-radius: 12px; background: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; font: bold 11px "Trebuchet MS", system-ui, sans-serif; color: #3a2a35; cursor: pointer; padding: 2px; }
  .sw .dot { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #3a2a35; }
  .sw[aria-pressed="true"] { background: #ffe9a8; outline: 3px solid #e0457a; outline-offset: 1px; }
  .sw:disabled { opacity: .55; cursor: default; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <button id="langBtn" class="ui-btn" type="button" data-ui></button>
  <button id="closetBtn" class="ui-btn" type="button" data-ui></button>
  <button id="shareBtn" class="ui-btn" type="button" data-ui hidden></button>
</div>
<form id="lbForm" hidden novalidate data-ui>
  <div class="card">
    <p class="lb-title" id="lbTitle"></p>
    <label for="lbName" id="lbLabel"></label>
    <input id="lbName" name="lbName" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done">
    <p id="lbErr" class="lb-err"></p>
    <div class="lb-row"><button type="button" id="lbSkip"></button><button type="submit" id="lbSave"></button></div>
  </div>
</form>
<div id="closet" class="card" hidden data-ui role="dialog" aria-labelledby="closetTitle">
  <h2 id="closetTitle"></h2>
  <h3 id="bowsTitle"></h3>
  <div class="swatches" id="bowSwatches"></div>
  <h3 id="collarsTitle"></h3>
  <div class="swatches" id="collarSwatches"></div>
  <h3 id="dressTitle"></h3>
  <div class="swatches" id="dressSwatches"></div>
  <h3 id="hairTitle"></h3>
  <div class="swatches" id="hairSwatches"></div>
  <button type="button" id="closetDone"></button>
</div>
<script>
(() => {
  const W = 420, H = 720;               // logical resolution
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const ui = document.getElementById('ui');
  let scale = 1;

  function resize() {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const cs = getComputedStyle(document.body);
    const vw = (window.visualViewport ? window.visualViewport.width : window.innerWidth) - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    scale = Math.min(vw / W, vh / H);
    cv.style.width = (W * scale) + 'px';
    cv.style.height = (H * scale) + 'px';
    cv.width = Math.round(W * scale * dpr);
    cv.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    const r = cv.getBoundingClientRect();
    ui.style.transform = `translate(${r.left}px, ${r.top}px) scale(${scale})`;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  let last = performance.now();

  // ---------- storage helpers ----------
  function load(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : v; } catch (e) { return fallback; } }
  function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
  const HS_KEY = 'milkyHop.highScore';
  let best = parseInt(load(HS_KEY, '0'), 10) || 0;
  function saveBest() { store(HS_KEY, String(best)); }

  // ---------- language (English / Spanish) ----------
  const STR = {
    en: {
      tapHop: 'Tap to hop', tapSpace: 'Tap or press Space',
      help1: 'Help Milky the cocker spaniel', help2: 'bounce past the plushie towers!', help3: 'Grab the treats for bonus points!',
      yourBest: 'Your best: ', topDog: 'Top dog: ',
      oof: 'Oof! Plush pile-up', score: 'Score', best: 'Best', newBest: 'NEW BEST!', newOutfit: 'New outfit unlocked!',
      week: 'THIS WEEK', all: 'ALL TIME', onPhone: 'saved on this phone only',
      loading: 'Loading scores...', loadErr: "Couldn't load the Top 10.", empty: 'No scores yet. Be the first!',
      tryAgain: 'Tap to try again',
      madeTop: 'You made the Top 10!', nameLabel: 'Your name (2 to 10 letters)', skip: 'Skip', save: 'Save',
      nameErr: 'Use 2 to 10 letters, no numbers or spaces.', nameBad: 'Please choose another name.',
      saveErr: "Couldn't save. Check your connection and try again.", full: 'The scoreboard is full right now.',
      share: 'Share my score', shareText: s => `I scored ${s} in Milky Hop! 🐶 Can you beat me?`,
      outfits: 'Outfits', bows: "Milky's bows", collars: "Milky's collars", dresses: "Girl's dresses", hair: "Girl's hair", done: 'Done', need: n => `Score ${n}`,
      medal: ['BRONZE MEDAL!', 'SILVER MEDAL!', 'GOLD MEDAL!'], treat: '+1 treat', langBtn: 'ES'
    },
    es: {
      tapHop: 'Toca para saltar', tapSpace: 'Toca o pulsa Espacio',
      help1: 'Ayuda a Milky, la cocker spaniel,', help2: 'a saltar las torres de peluches', help3: '¡Atrapa los premios para sumar más!',
      yourBest: 'Tu récord: ', topDog: 'Líder: ',
      oof: '¡Uy! Choque de peluches', score: 'Puntos', best: 'Récord', newBest: '¡NUEVO RÉCORD!', newOutfit: '¡Nuevo accesorio!',
      week: 'ESTA SEMANA', all: 'HISTÓRICO', onPhone: 'guardado solo en este teléfono',
      loading: 'Cargando puntajes...', loadErr: 'No se pudo cargar el Top 10.', empty: 'Aún no hay puntajes. ¡Sé el primero!',
      tryAgain: 'Toca para jugar otra vez',
      madeTop: '¡Entraste al Top 10!', nameLabel: 'Tu nombre (de 2 a 10 letras)', skip: 'Omitir', save: 'Guardar',
      nameErr: 'Usa de 2 a 10 letras, sin números ni espacios.', nameBad: 'Elige otro nombre, por favor.',
      saveErr: 'No se pudo guardar. Revisa tu conexión e inténtalo otra vez.', full: 'El marcador está lleno por ahora.',
      share: 'Compartir puntaje', shareText: s => `¡Hice ${s} puntos en Milky Hop! 🐶 ¿Me ganas?`,
      outfits: 'Accesorios', bows: 'Lazos de Milky', collars: 'Collares de Milky', dresses: 'Vestidos de la chica', hair: 'Peinado de la chica', done: 'Listo', need: n => `${n} puntos`,
      medal: ['¡MEDALLA DE BRONCE!', '¡MEDALLA DE PLATA!', '¡MEDALLA DE ORO!'], treat: '+1 premio', langBtn: 'EN'
    }
  };
  let lang = load('milkyHop.lang', null) || ((navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'en');
  const L = () => STR[lang];

  // ---------- outfits (unlocked by your best score) ----------
  const BOWS = [
    { id: 'pink', c: '#ff5d8f', d: '#e0457a', need: 0 },
    { id: 'sky', c: '#5ec8ff', d: '#2a9fd6', need: 5 },
    { id: 'lilac', c: '#b38bff', d: '#8a5be0', need: 15 },
    { id: 'gold', c: '#ffd23f', d: '#d9a400', need: 30 },
    { id: 'rainbow', c: 'rainbow', d: '#e0457a', need: 50 }
  ];
  const COLLARS = [
    { id: 'red', c: '#e63946', need: 0 },
    { id: 'mint', c: '#2ec4b6', need: 10 },
    { id: 'navy', c: '#3a4fa3', need: 20 },
    { id: 'pearl', c: '#f8f4ec', need: 40 }
  ];
  const DRESSES = [
    { id: 'yellow', c: '#f7cf3d', d: '#d9a91c', need: 0 },
    { id: 'mint', c: '#7fdcc0', d: '#3fb394', need: 8 },
    { id: 'coral', c: '#ff8a7a', d: '#e0604f', need: 18 },
    { id: 'lavender', c: '#c3a6ff', d: '#9277d9', need: 35 }
  ];
  const HAIRS = [
    { id: 'none', c: 'none', need: 0 },
    { id: 'headband', c: '#ff5d8f', need: 12 },
    { id: 'daisy', c: '#ffffff', need: 25 },
    { id: 'sunhat', c: '#e8c37a', need: 45 }
  ];
  let bowId = load('milkyHop.bow', 'pink'), collarId = load('milkyHop.collar', 'red');
  let dressId = load('milkyHop.dress', 'yellow'), hairId = load('milkyHop.hair', 'none');
  const unlockedCount = b => [BOWS, COLLARS, DRESSES, HAIRS].reduce((n, l) => n + l.filter(x => x.need <= b).length, 0);

  // ---------- medals ----------
  const MEDALS = [{ at: 10, c: '#cd7f32', d: '#9c5a1f' }, { at: 25, c: '#d9dde3', d: '#9aa1ab' }, { at: 50, c: '#ffd23f', d: '#d9a400' }];
  function medalFor(s) { let m = -1; MEDALS.forEach((x, i) => { if (s >= x.at) m = i; }); return m; }

  // ---------- Top 10 leaderboards (this week + all time) ----------
  // Shared web version: Supabase project URL and its public (publishable) key. Empty = not used.
  const LB_CONFIG = { url: 'https://pakriswoescdnwhhkyxt.supabase.co', key: 'sb_publishable_8q6JtvbW1quYl_0zY55Jpg_Z4HWx865' };
  const LB_REMOTE = !!(LB_CONFIG.url && LB_CONFIG.key);
  const LB_LOCAL_KEY = 'milkyHop.scores', LB_NAME_KEY = 'milkyHop.lastName';
  const NAME_RE = /^[A-ZÁÉÍÓÚÜÑ]{2,10}$/;
  const BLOCK_ANY = ['PUTA', 'PUTO', 'MIERD', 'CONCHA', 'PENDEJ', 'CABRON', 'CABRÓN', 'PICHUL', 'VERGA', 'PINGA', 'CHUCHA', 'HUEVON', 'HUEVÓN', 'COJUD',
    'MARICON', 'MARICÓN', 'CULER', 'FUCK', 'SHIT', 'BITCH', 'DICK', 'PUSSY', 'CUNT', 'NAZI', 'HITLER', 'PORN', 'NIGG', 'WHORE', 'SLUT', 'COCK', 'PENE', 'VAGINA'];
  const BLOCK_EXACT = ['ASS', 'SEX', 'CULO', 'CACA', 'POTO', 'TETA', 'TETAS', 'KKK', 'FAG'];
  const nameOk = n => !BLOCK_EXACT.includes(n) && !BLOCK_ANY.some(w => n.includes(w));

  let boardAll = [], boardWeek = [], boardStatus = 'loading', lbTab = 'week';
  let myEntryId = null, formOpen = false, pendingScore = 0, savedThisRun = false;
  let lbMode = 'pending', db = null, canWrite = false;

  function weekStartMs() {           // Monday 00:00 in Lima (UTC-5)
    const OFF = 5 * 3600e3, lima = new Date(Date.now() - OFF);
    const back = (lima.getUTCDay() + 6) % 7;
    return Date.UTC(lima.getUTCFullYear(), lima.getUTCMonth(), lima.getUTCDate() - back) + OFF;
  }
  const byScore = (a, b) => b.score - a.score || (a.at || 0) - (b.at || 0);
  function derive(rows) {
    const clean = rows.filter(r => typeof r.name === 'string' && typeof r.score === 'number').sort(byScore);
    const ws = weekStartMs();
    boardAll = clean.slice(0, 10);
    boardWeek = clean.filter(r => (r.at || 0) >= ws).slice(0, 10);
    boardStatus = 'ok';
  }
  function readLocal() {
    try { const b = JSON.parse(load(LB_LOCAL_KEY, '[]')); return Array.isArray(b) ? b : []; } catch (e) { return []; }
  }
  function remoteHeaders(extra) {
    const h = { apikey: LB_CONFIG.key };
    if (!LB_CONFIG.key.startsWith('sb_')) h.Authorization = 'Bearer ' + LB_CONFIG.key;   // legacy anon JWT keys
    return Object.assign(h, extra || {});
  }
  const API = () => LB_CONFIG.url.replace(/\/$/, '') + '/rest/v1/scores';
  async function getJson(url) {
    const r = await fetch(url, { headers: remoteHeaders(), cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
  async function refreshRemote() {
    try {
      const q = API() + '?select=id,name,score,created_at&order=score.desc,id.asc&limit=10';
      const since = new Date(weekStartMs()).toISOString();
      const [a, w] = await Promise.all([getJson(q), getJson(q + '&created_at=gte.' + encodeURIComponent(since))]);
      boardAll = a; boardWeek = w; boardStatus = 'ok';
    } catch (e) { if (!boardAll.length) boardStatus = 'error'; }
  }
  (async () => {
    if (LB_REMOTE) {
      lbMode = 'remote'; canWrite = true;
      await refreshRemote();
      setInterval(() => { if (state !== 'play' && !document.hidden) refreshRemote(); }, 15000);
      return;
    }
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (!db) { lbMode = 'local'; canWrite = true; derive(readLocal()); return; }
    lbMode = 'shared';
    try {
      const u = await window.claude.use('user');
      const w = u ? await u.can('data.write') : null;
      canWrite = w !== false;            // null = not told: offer it and let the save decide
    } catch (e) { canWrite = true; }
    const timer = setTimeout(() => { if (boardStatus === 'loading') boardStatus = 'error'; }, 10000);
    db.collection('scores').orderBy('score', 'desc').limit(300).onSnapshot(snap => {
      clearTimeout(timer);
      derive(snap.docs.map(d => { const v = d.data(); return Object.assign({ id: d.id }, v, { at: Date.parse(v.at) || 0 }); }));
    }, () => { clearTimeout(timer); if (!boardAll.length) boardStatus = 'error'; });
  })();

  async function submitScore(name, sc, secs) {
    if (lbMode === 'remote') {
      const post = body => fetch(API(), {
        method: 'POST', headers: remoteHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }), body: JSON.stringify(body)
      });
      let r = await post({ name, score: sc, run_seconds: secs });
      if (!r.ok) {
        const txt = await r.text().catch(() => '');
        if (r.status === 400 && /run_seconds/.test(txt)) r = await post({ name, score: sc });   // database not upgraded yet
        if (!r.ok) throw new Error('HTTP ' + r.status);
      }
      const rows = await r.json();
      await refreshRemote();
      return rows && rows[0] ? rows[0].id : null;
    }
    if (lbMode === 'shared') {
      const ref = await db.collection('scores').add({ name, score: sc, run_seconds: secs, at: new Date().toISOString() });
      return ref.id;
    }
    const id = Date.now();
    const b = readLocal(); b.push({ id, name, score: sc, at: id });
    b.sort(byScore);
    store(LB_LOCAL_KEY, JSON.stringify(b.slice(0, 300)));
    derive(b);
    return id;
  }
  const fits = (list, sc) => list.length < 10 || sc > list[list.length - 1].score;
  function qualifies(sc) {
    return sc > 0 && canWrite && !savedThisRun && boardStatus === 'ok' && (fits(boardWeek, sc) || fits(boardAll, sc));
  }

  // ---------- DOM: name form, closet, buttons ----------
  const $ = id => document.getElementById(id);
  const lbForm = $('lbForm'), lbName = $('lbName'), lbErr = $('lbErr'), lbSave = $('lbSave'), lbSkip = $('lbSkip');
  const langBtn = $('langBtn'), closetBtn = $('closetBtn'), shareBtn = $('shareBtn'), closet = $('closet');
  let closetOpen = false, pendingSecs = 0;

  function applyLang() {
    const s = L();
    document.documentElement.lang = lang;
    $('lbTitle').textContent = s.madeTop; $('lbLabel').textContent = s.nameLabel;
    lbSkip.textContent = s.skip; lbSave.textContent = s.save;
    langBtn.textContent = s.langBtn; langBtn.setAttribute('aria-label', lang === 'en' ? 'Cambiar a español' : 'Switch to English');
    closetBtn.textContent = '🎀 ' + s.outfits; shareBtn.textContent = '💬 ' + s.share;
    $('closetTitle').textContent = s.outfits; $('bowsTitle').textContent = s.bows; $('collarsTitle').textContent = s.collars;
    $('dressTitle').textContent = s.dresses; $('hairTitle').textContent = s.hair;
    $('closetDone').textContent = s.done;
    if (closetOpen) buildCloset();
  }
  langBtn.addEventListener('click', () => { lang = lang === 'en' ? 'es' : 'en'; store('milkyHop.lang', lang); applyLang(); });

  function buildCloset() {
    const mk = (list, cur, container, pick) => {
      container.textContent = '';
      list.forEach(item => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'sw';
        const locked = item.need > best;
        b.disabled = locked;
        b.setAttribute('aria-pressed', String(item.id === cur));
        const dot = document.createElement('span'); dot.className = 'dot';
        dot.style.background = locked ? '#ddd' : item.c === 'rainbow' ? 'conic-gradient(#ff5d8f, #ffd23f, #2ec4b6, #5ec8ff, #b38bff, #ff5d8f)'
          : item.c === 'none' ? 'linear-gradient(135deg, #fff 44%, #3a2a35 44%, #3a2a35 56%, #fff 56%)'
          : item.id === 'daisy' ? 'radial-gradient(circle, #ffd23f 30%, #fff 32%)' : item.c;
        const lab = document.createElement('span');
        lab.textContent = locked ? '🔒 ' + item.need : (item.need ? String(item.need) : '★');
        b.append(dot, lab);
        b.setAttribute('aria-label', item.id + (locked ? ' — ' + L().need(item.need) : ''));
        b.addEventListener('click', () => { pick(item.id); buildCloset(); });
        container.append(b);
      });
    };
    mk(BOWS, bowId, $('bowSwatches'), id => { bowId = id; store('milkyHop.bow', id); });
    mk(COLLARS, collarId, $('collarSwatches'), id => { collarId = id; store('milkyHop.collar', id); });
    mk(DRESSES, dressId, $('dressSwatches'), id => { dressId = id; store('milkyHop.dress', id); });
    mk(HAIRS, hairId, $('hairSwatches'), id => { hairId = id; store('milkyHop.hair', id); });
  }
  closetBtn.addEventListener('click', () => { closetOpen = true; buildCloset(); closet.hidden = false; });
  $('closetDone').addEventListener('click', () => { closetOpen = false; closet.hidden = true; });

  shareBtn.addEventListener('click', async () => {
    const url = 'https://milkyhop.netlify.app';
    const msg = L().shareText(lastScore);
    if (navigator.share) {
      try { await navigator.share({ text: msg, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = 'https://wa.me/?text=' + encodeURIComponent(msg + ' ' + url); a.target = '_blank'; a.rel = 'noopener';
    document.body.append(a); a.click(); a.remove();
  });

  function openForm(sc, secs) {
    pendingScore = sc; pendingSecs = secs; formOpen = true; lbErr.textContent = ''; lbSave.disabled = false;
    lbName.value = load(LB_NAME_KEY, '');
    lbForm.hidden = false;
    setTimeout(() => { try { lbName.focus(); } catch (e) {} }, 50);
  }
  function closeForm() { formOpen = false; lbForm.hidden = true; lbName.blur(); }
  lbName.addEventListener('input', () => {
    const clean = lbName.value.toUpperCase().replace(/[^A-ZÁÉÍÓÚÜÑ]/g, '').slice(0, 10);
    if (clean !== lbName.value) lbName.value = clean;
    lbErr.textContent = '';
  });
  lbSkip.addEventListener('click', closeForm);
  lbForm.addEventListener('submit', async e => {
    e.preventDefault();
    if (savedThisRun) { closeForm(); return; }
    const name = lbName.value.trim().toUpperCase();
    if (!NAME_RE.test(name)) { lbErr.textContent = L().nameErr; return; }
    if (!nameOk(name)) { lbErr.textContent = L().nameBad; return; }
    lbSave.disabled = true; lbErr.textContent = '';
    try {
      savedThisRun = true;
      myEntryId = await submitScore(name, pendingScore, pendingSecs);
      store(LB_NAME_KEY, name);
      if (!boardWeek.some(r => r.id === myEntryId) && boardAll.some(r => r.id === myEntryId)) lbTab = 'all';
      closeForm();
    } catch (err) {
      savedThisRun = false;
      if (err && err.code === 'invalid_argument') { canWrite = false; closeForm(); return; }
      lbSave.disabled = false;
      lbErr.textContent = err && err.code === 'quota_exceeded' ? L().full : L().saveErr;
    }
  });
  applyLang();

  // ---------- audio (tiny synth blips) ----------
  let actx = null, muted = false;
  function tone(freq, dur, type = 'sine', vol = 0.15, slide = 0) {
    if (muted || !actx) return;
    try {
      if (actx.state !== 'running') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, actx.currentTime + dur);
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  function unlockAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state !== 'running') actx.resume();
      const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource();
      src.buffer = b; src.connect(actx.destination); src.start(0);
    } catch (e) {}
  }
  const sfx = {
    hop: () => tone(520, 0.12, 'triangle', 0.12, 1.6),
    point: () => { tone(880, 0.08, 'square', 0.06); setTimeout(() => tone(1175, 0.1, 'square', 0.06), 70); },
    treat: () => { tone(1320, 0.07, 'sine', 0.1); setTimeout(() => tone(1760, 0.09, 'sine', 0.1), 60); },
    medal: () => [784, 988, 1175, 1568].forEach((f, i) => setTimeout(() => tone(f, 0.14, 'triangle', 0.1), i * 90)),
    bonk: () => { tone(220, 0.25, 'sawtooth', 0.12, 0.4); setTimeout(() => tone(330, 0.15, 'triangle', 0.1, 0.6), 120); }
  };

  // ---------- game constants ----------
  const GROUND = H - 90;
  const GRAVITY = 1500, HOP_V = -470, MAX_FALL = 720;
  const PLUSH_R = 30;               // radius of one plush
  const STACK_W = PLUSH_R * 2 + 8;
  const PALETTE = [
    ['#ffb3c7', '#ff8fab'], ['#b8e0ff', '#8cc8f5'], ['#c9f2c7', '#9fdc9b'],
    ['#ffe0a3', '#ffc864'], ['#dccbff', '#bba3f5'], ['#ffd0b5', '#ffad85']
  ];
  const EARS = ['cat', 'bear', 'bunny', 'none', 'horns'];

  let state = 'start';   // start | play | over
  const girl = { x: 58, run: 0 };
  let dog, stacks, treats, clouds, hills, stars, particles, score, speed, spawnT, groundX, t, overT, newBest;
  let spawned = 0, runTime = 0, toast = null, lastScore = 0, unlockedNew = false, skyT = 0;

  function reset() {
    dog = { x: 120, y: H * 0.42, vy: 0, rot: 0, ear: 0, legs: 0 };
    stacks = []; treats = []; particles = [];
    girl.x = 58;
    score = 0; speed = 170; spawnT = 0.6; groundX = 0; overT = 0; newBest = false;
    spawned = 0; runTime = 0; toast = null; savedThisRun = false; unlockedNew = false; myEntryId = null;
  }
  clouds = Array.from({ length: 5 }, (_, i) => ({ x: i * 110 + Math.random() * 60, y: 60 + Math.random() * 220, s: 0.6 + Math.random() * 0.7 }));
  hills = Array.from({ length: 6 }, (_, i) => ({ x: i * 120, h: 60 + Math.random() * 60 }));
  stars = Array.from({ length: 40 }, () => ({ x: Math.random() * W, y: Math.random() * 380, r: 0.6 + Math.random() * 1.4, p: Math.random() * 6 }));
  t = 0;
  reset();

  function randomPlush() {
    const c = PALETTE[(Math.random() * PALETTE.length) | 0];
    return { c, ear: EARS[(Math.random() * EARS.length) | 0], face: (Math.random() * 3) | 0, blush: Math.random() < 0.7 };
  }

  function spawnStack() {
    // the first three towers have wide gaps near the middle so new players can get going
    const easy = spawned < 3;
    const gap = easy ? 270 - spawned * 20 : Math.max(175, 230 - score * 2.2);
    const minTop = 80, maxTop = GROUND - gap - 70;
    let gapTop = minTop + Math.random() * (maxTop - minTop);
    if (easy) { const mid = (GROUND - gap) / 2; gapTop = mid + (Math.random() - 0.5) * 80; }
    const gapBot = gapTop + gap;
    const top = [], bot = [];
    for (let y = gapTop - PLUSH_R; y > -PLUSH_R * 2; y -= PLUSH_R * 1.75) top.push({ y, p: randomPlush(), wob: Math.random() * 6 });
    for (let y = gapBot + PLUSH_R; y < GROUND + PLUSH_R; y += PLUSH_R * 1.75) bot.push({ y, p: randomPlush(), wob: Math.random() * 6 });
    const x = W + STACK_W;
    stacks.push({ x, gapTop, gapBot, top, bot, passed: false });
    // a dog treat floats in most gaps (never in the very first one)
    if (spawned > 0 && Math.random() < 0.65) {
      const off = (Math.random() - 0.5) * (gap - 90);
      treats.push({ x: x + (Math.random() < 0.5 ? 0 : STACK_W * 0.9), y: gapTop + gap / 2 + off, got: false, ph: Math.random() * 6 });
    }
    spawned++;
  }

  // ---------- input ----------
  function press() {
    if (formOpen || closetOpen) return;
    if (state === 'start') { state = 'play'; reset(); hop(); return; }
    if (state === 'play') { hop(); return; }
    if (state === 'over' && overT > 0.6) { state = 'start'; reset(); }
  }
  function hop() {
    dog.vy = HOP_V; dog.ear = -1; sfx.hop();
    for (let i = 0; i < 5; i++) particles.push({ x: dog.x - 18, y: dog.y + 14, vx: -60 - Math.random() * 60, vy: (Math.random() - 0.3) * 80, life: 0.4, kind: 'puff' });
  }
  window.addEventListener('keydown', e => {
    if (formOpen || closetOpen || e.target === lbName) return;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) press(); }
    if (e.code === 'KeyM') muted = !muted;
  });
  const TAB_Y = 252, TAB_H = 28;
  function tapAt(clientX, clientY) {
    unlockAudio();
    const r = cv.getBoundingClientRect();
    const x = (clientX - r.left) / scale, y = (clientY - r.top) / scale;
    if (x > W - 56 && y < 56) { muted = !muted; return; }   // mute button
    if (state === 'over' && !formOpen && y >= TAB_Y && y <= TAB_Y + TAB_H && Math.abs(x - W / 2) <= 132) {
      lbTab = x < W / 2 ? 'week' : 'all'; return;            // leaderboard tabs
    }
    press();
  }
  const inUI = e => e.target.closest && e.target.closest('[data-ui]');
  // whole screen is the tap zone (including letterbox bars around the canvas)
  document.addEventListener('touchstart', e => {
    if (inUI(e)) return;               // let buttons and the name form work normally
    e.preventDefault();
    const tch = e.changedTouches[0]; tapAt(tch.clientX, tch.clientY);
  }, { passive: false });
  document.addEventListener('touchmove', e => { if (!inUI(e)) e.preventDefault(); }, { passive: false });
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') return;   // handled by touchstart
    if (inUI(e)) return;
    e.preventDefault(); tapAt(e.clientX, e.clientY);
  });
  ['gesturestart', 'gesturechange', 'dblclick', 'contextmenu'].forEach(ev => document.addEventListener(ev, e => { if (!inUI(e)) e.preventDefault(); }, { passive: false }));
  window.addEventListener('keydown', unlockAudio, { once: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (actx && actx.state === 'running') actx.suspend(); }
    else { last = performance.now(); }
  });

  function addPoint(n, x, y) {
    const before = score;
    score += n;
    const m = medalFor(score);
    if (m > medalFor(before)) { toast = { text: L().medal[m], t: 0, medal: m }; sfx.medal(); }
    for (let i = 0; i < 8; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 160, vy: -80 - Math.random() * 120, life: 0.8, kind: 'star' });
  }

  // ---------- update ----------
  function update(dt) {
    t += dt;
    for (const c of clouds) { c.x -= (state === 'play' ? speed * 0.15 : 12) * dt * c.s; if (c.x < -80) { c.x = W + 60; c.y = 60 + Math.random() * 220; } }
    const scroll = state === 'over' ? 0 : (state === 'play' ? speed : 120);
    groundX = (groundX + scroll * dt) % 40;
    for (const h of hills) { h.x -= scroll * 0.3 * dt; if (h.x < -140) { h.x += 720; h.h = 60 + Math.random() * 60; } }
    // sky follows the score: day until 12, sunset by 22, night from 38
    const tgt = state === 'start' ? 0 : (score < 12 ? 0 : score < 28 ? Math.min(1, (score - 12) / 10) : 1 + Math.min(1, (score - 28) / 10));
    skyT += ((state === 'start' ? 0 : tgt) - skyT) * Math.min(1, dt * 1.5);

    if (state === 'start') {
      dog.y = H * 0.42 + Math.sin(t * 3) * 12; dog.rot = Math.sin(t * 3) * 0.08; dog.legs += dt * 10;
    } else if (state === 'play') {
      runTime += dt;
      speed = Math.min(300, 170 + score * 4);
      dog.vy = Math.min(MAX_FALL, dog.vy + GRAVITY * dt);
      dog.y += dog.vy * dt;
      dog.rot = Math.max(-0.45, Math.min(1.1, dog.vy / 650));
      dog.ear += (Math.min(1, dog.vy / 400) - dog.ear) * Math.min(1, dt * 8);
      dog.legs += dt * 14;

      spawnT -= dt;
      if (spawnT <= 0) { spawnStack(); spawnT = Math.max(230, 290 - score * 2) / speed; }

      for (const s of stacks) {
        s.x -= speed * dt;
        if (!s.passed && s.x + STACK_W / 2 < dog.x) { s.passed = true; sfx.point(); addPoint(1, dog.x + 10, dog.y - 20); }
      }
      stacks = stacks.filter(s => s.x > -STACK_W);
      for (const tr of treats) {
        tr.x -= speed * dt;
        if (!tr.got) {
          const dx = dog.x + 18 - tr.x, dy = dog.y - 8 - tr.y;
          if (dx * dx + dy * dy < 30 * 30) {
            tr.got = true; sfx.treat(); addPoint(1, tr.x, tr.y);
            particles.push({ x: tr.x, y: tr.y - 10, vx: 0, vy: -50, life: 0.9, kind: 'label', text: L().treat });
          }
        }
      }
      treats = treats.filter(tr => tr.x > -30 && !tr.got);
      if (toast) { toast.t += dt; if (toast.t > 1.8) toast = null; }

      if (collides()) gameOver();
    } else if (state === 'over') {
      overT += dt;
      if (dog.y < GROUND - 22) { dog.vy = Math.min(MAX_FALL, dog.vy + GRAVITY * dt); dog.y += dog.vy * dt; dog.rot = Math.min(Math.PI * 0.6, dog.rot + dt * 4); }
      else dog.y = GROUND - 22;
    }

    // the girl runs along the ground after Milky; on a crash she hurries over to check on her
    if (state === 'over') { if (girl.x < 70) { girl.x += 70 * dt; girl.run += dt * 12; } }
    else girl.run += dt * (state === 'play' ? speed / 16 : 9);
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.kind === 'star' ? 300 : 0) * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    syncButtons();
  }

  function collides() {
    const r = 17, cx = dog.x + 2, cy = dog.y;   // forgiving hitbox
    if (cy + r >= GROUND || cy - r <= -40) return true;
    for (const s of stacks) {
      for (const pl of s.top.concat(s.bot)) {
        const dx = cx - s.x, dy = cy - pl.y;
        if (dx * dx + dy * dy < (r + PLUSH_R - 3) ** 2) return true;
      }
    }
    return false;
  }

  function gameOver() {
    state = 'over'; overT = 0; sfx.bonk(); toast = null;
    dog.vy = -250;
    lastScore = score;
    if (score > best) {
      unlockedNew = unlockedCount(score) > unlockedCount(best);
      best = score; newBest = true; saveBest();
    }
    myEntryId = null;
    const finalScore = score, secs = Math.round(runTime * 10) / 10;
    if (lbMode === 'local') derive(readLocal());
    if (lbMode === 'remote') refreshRemote();
    lbTab = 'week';
    setTimeout(() => { if (state === 'over' && !formOpen && qualifies(finalScore)) openForm(finalScore, secs); }, 600);
    for (let i = 0; i < 14; i++) particles.push({ x: dog.x, y: dog.y, vx: (Math.random() - 0.5) * 260, vy: (Math.random() - 0.5) * 260, life: 0.6, kind: 'puff' });
  }

  let shown = {};
  function show(el, on) { if (shown[el.id] !== on) { shown[el.id] = on; el.hidden = !on; } }
  function syncButtons() {
    show(langBtn, state === 'start' && !closetOpen);
    show(closetBtn, state === 'start' && !closetOpen);
    show(shareBtn, state === 'over' && overT > 0.6 && !formOpen && lastScore > 0);
  }

  // ---------- drawing helpers ----------
  function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
  function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  function mix(a, b, k) { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',') + ')'; }
  function mix3(day, dusk, night) { return skyT <= 1 ? mix(day, dusk, skyT) : mix(dusk, night, skyT - 1); }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H), top = mix3('#7ec8f2', '#ff9a8b', '#141b44');
    g.addColorStop(0, top);
    g.addColorStop(0.65, mix3('#cdeefc', '#ffc3a0', '#3b3f7a'));
    g.addColorStop(1, mix3('#fff3dc', '#ffe8c2', '#6b5b95'));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const night = Math.max(0, skyT - 1);
    if (night > 0) {
      for (const s of stars) { ctx.globalAlpha = night * (0.5 + 0.5 * Math.sin(t * 2 + s.p)); ellipse(s.x, s.y, s.r, s.r, '#fff'); }
      ctx.globalAlpha = 1;
    }
    // sun sets behind the hills, then the moon comes up
    const sunK = Math.min(1, skyT);
    const sunY = 110 + sunK * 250 + night * 200;
    ctx.globalAlpha = 1 - night;
    ellipse(330, sunY, 46, 46, sunK > 0.5 ? 'rgba(255,170,90,.45)' : 'rgba(255,240,170,.55)'); ellipse(330, sunY, 32, 32, mix('#fff2a8', '#ffa94d', sunK));
    ctx.globalAlpha = night;
    ellipse(90, 110, 26, 26, '#f4f1de'); ellipse(100, 104, 24, 24, top);
    ctx.globalAlpha = 1;
    for (const c of clouds) {
      ctx.globalAlpha = 0.9 - night * 0.6;
      const cc = mix3('#ffffff', '#ffe1d6', '#8c8fbf');
      ellipse(c.x, c.y, 34 * c.s, 18 * c.s, cc); ellipse(c.x + 24 * c.s, c.y + 4 * c.s, 26 * c.s, 15 * c.s, cc); ellipse(c.x - 22 * c.s, c.y + 5 * c.s, 22 * c.s, 13 * c.s, cc);
    }
    ctx.globalAlpha = 1;
    const hc = mix3('#a8dba0', '#c9c78a', '#4f6f6a');
    for (const h of hills) ellipse(h.x, GROUND + 10, 110, h.h, hc);
  }

  function drawGround() {
    ctx.fillStyle = mix3('#7cc46f', '#8fb862', '#3f6d4a'); ctx.fillRect(0, GROUND, W, 18);
    ctx.fillStyle = mix3('#e8c48f', '#e2b47e', '#7d6a5a'); ctx.fillRect(0, GROUND + 18, W, H - GROUND - 18);
    ctx.fillStyle = mix3('#d9ad72', '#cf9f68', '#6a5747');
    for (let x = -groundX; x < W + 40; x += 40) { ctx.beginPath(); ctx.arc(x, GROUND + 46, 6, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(x + 20, GROUND + 70, 4, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = mix3('#5fae55', '#76a04f', '#2f5a3b');
    for (let x = -groundX; x < W + 40; x += 20) { ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(x + 5, GROUND - 7); ctx.lineTo(x + 10, GROUND); ctx.fill(); }
  }

  function drawPlush(x, y, p, wob) {
    const r = PLUSH_R;
    const sq = 1 + Math.sin(t * 4 + wob) * 0.03;
    ctx.save(); ctx.translate(x, y); ctx.scale(1 / sq, sq);
    ctx.fillStyle = p.c[1];
    if (p.ear === 'cat') { for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 10, -r + 6); ctx.lineTo(s * 22, -r - 10); ctx.lineTo(s * 25, -r + 14); ctx.fill(); } }
    if (p.ear === 'bear') { ellipse(-19, -r + 6, 9, 9, p.c[1]); ellipse(19, -r + 6, 9, 9, p.c[1]); }
    if (p.ear === 'bunny') { ellipse(-10, -r - 6, 6, 16, p.c[1], -0.2); ellipse(10, -r - 6, 6, 16, p.c[1], 0.2); }
    if (p.ear === 'horns') { ctx.fillStyle = '#fff6d6'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 8, -r + 4); ctx.lineTo(s * 13, -r - 12); ctx.lineTo(s * 18, -r + 6); ctx.fill(); } }
    ellipse(0, 0, r + 2, r - 1, p.c[0]);
    ellipse(0, r * 0.35, r * 0.75, r * 0.5, 'rgba(255,255,255,.35)');
    ellipse(-r * 0.4, -r * 0.45, r * 0.25, r * 0.13, 'rgba(255,255,255,.55)', -0.5);
    ctx.lineWidth = 2; ctx.strokeStyle = p.c[1]; ctx.beginPath(); ctx.ellipse(0, 0, r + 2, r - 1, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#3a2a35';
    if (p.face === 2) { ctx.lineWidth = 2.2; ctx.strokeStyle = '#3a2a35'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * 9, -3, 3.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); } }
    else { ellipse(-9, -3, 2.8, 3.4, '#3a2a35'); ellipse(9, -3, 2.8, 3.4, '#3a2a35'); ellipse(-8, -4.3, 1, 1, '#fff'); ellipse(10, -4.3, 1, 1, '#fff'); }
    ctx.lineWidth = 1.8; ctx.strokeStyle = '#3a2a35'; ctx.beginPath();
    if (p.face === 1) { ctx.arc(0, 4, 3, 0, Math.PI * 2); } else { ctx.arc(-2.5, 3, 2.5, 0, Math.PI); ctx.arc(2.5, 3, 2.5, 0, Math.PI); }
    ctx.stroke();
    if (p.blush) { ellipse(-16, 4, 4.5, 2.5, 'rgba(255,110,140,.45)'); ellipse(16, 4, 4.5, 2.5, 'rgba(255,110,140,.45)'); }
    ctx.restore();
  }

  function drawStacks() {
    for (const s of stacks) {
      for (const pl of s.top) drawPlush(s.x, pl.y, pl.p, pl.wob);
      for (let i = s.bot.length - 1; i >= 0; i--) drawPlush(s.x, s.bot[i].y, s.bot[i].p, s.bot[i].wob);
    }
  }

  // dog treat: a little bone with a soft glow
  function drawTreats() {
    for (const tr of treats) {
      const y = tr.y + Math.sin(t * 4 + tr.ph) * 4;
      ctx.save(); ctx.translate(tr.x, y); ctx.rotate(-0.35 + Math.sin(t * 3 + tr.ph) * 0.15);
      ellipse(0, 0, 22, 14, 'rgba(255,240,170,.35)');
      ctx.fillStyle = '#fff4e0'; ctx.strokeStyle = '#b98b52'; ctx.lineWidth = 2;
      const bone = () => {
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-10, -3.5, 20, 7, 3) : ctx.rect(-10, -3.5, 20, 7);
        for (const [cx, cy] of [[-11, -4], [-11, 4], [11, -4], [11, 4]]) { ctx.moveTo(cx + 5, cy); ctx.arc(cx, cy, 5, 0, Math.PI * 2); }
      };
      bone(); ctx.stroke(); bone(); ctx.fill();
      ctx.restore();
    }
  }

  function drawBow() {
    const b = BOWS.find(x => x.id === bowId && x.need <= best) || BOWS[0];
    let fill = b.c;
    if (b.c === 'rainbow') { const g = ctx.createLinearGradient(-11, 0, 11, 0); ['#ff5d8f', '#ffd23f', '#2ec4b6', '#5ec8ff', '#b38bff'].forEach((c, i) => g.addColorStop(i / 4, c)); fill = g; }
    ctx.save(); ctx.translate(-1, -13); ctx.rotate(-0.25);
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-11, -7); ctx.lineTo(-11, 7); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(11, -7); ctx.lineTo(11, 7); ctx.closePath(); ctx.fill();
    ctx.fillStyle = b.d;
    ctx.beginPath(); ctx.moveTo(-1, 1); ctx.lineTo(-5, 9); ctx.lineTo(-1.5, 8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(1, 1); ctx.lineTo(5, 9); ctx.lineTo(1.5, 8); ctx.closePath(); ctx.fill();
    ellipse(0, 0, 3.6, 3.6, b.d);
    ellipse(-7, -2, 2, 1.2, 'rgba(255,255,255,.5)');
    ctx.restore();
  }

  // Cocker spaniel: golden coat, long wavy droopy ears, domed head, feathered legs
  function drawDog(x, y, rot) {
    const coat = '#d99a4e', dark = '#b8742f', light = '#f2c98b';
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    const legSwing = state === 'over' ? 0 : Math.sin(dog.legs) * 0.5;
    ctx.save(); ctx.translate(-26, -8); ctx.rotate(-0.6 + Math.sin(t * 18) * 0.35); ellipse(-6, 0, 9, 4.5, dark); ctx.restore();
    for (const [lx, a] of [[-16, legSwing], [-8, -legSwing]]) { ctx.save(); ctx.translate(lx, 10); ctx.rotate(a); ellipse(0, 9, 5.5, 10, lx === -16 ? dark : coat); ellipse(1, 18, 6, 4, light); ctx.restore(); }
    ellipse(-4, 0, 26, 16, coat);
    ellipse(-6, 8, 18, 7, light);
    for (const [lx, a] of [[10, -legSwing], [16, legSwing]]) { ctx.save(); ctx.translate(lx, 10); ctx.rotate(a); ellipse(0, 9, 5.5, 10, lx === 10 ? dark : coat); ellipse(1, 18, 6, 4, light); ctx.restore(); }
    ctx.save(); ctx.translate(24, -14);
    ctx.save(); ctx.translate(-4, -2); ctx.rotate(0.25 + dog.ear * 0.5); ellipse(-2, 14, 8, 17, dark); ctx.restore();
    ellipse(0, 0, 15, 14, coat);
    ellipse(13, 5, 11, 8, light);
    ellipse(23, 2, 4, 3.4, '#2d1b14');
    ellipse(22, 1, 1.2, 0.9, 'rgba(255,255,255,.6)');
    ctx.strokeStyle = '#6b3d1d'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(16, 9, 4, 0.1, Math.PI * 0.8); ctx.stroke();
    if (state === 'over') { ctx.strokeStyle = '#2d1b14'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(4, -6); ctx.lineTo(10, -1); ctx.moveTo(10, -6); ctx.lineTo(4, -1); ctx.stroke(); }
    else { ellipse(7, -3, 3.4, 4, '#2d1b14'); ellipse(8, -4.4, 1.2, 1.2, '#fff'); }
    drawBow();
    if (state === 'play' && dog.vy < 0) ellipse(17, 13, 3, 5, '#ff7b8f');
    ctx.save(); ctx.translate(-6, -2); ctx.rotate(0.15 + dog.ear * 0.6);
    ellipse(0, 15, 9, 19, dark);
    ctx.strokeStyle = '#9c5f22'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(-1, 8 + i * 8, 5, 0.2, Math.PI - 0.2); ctx.stroke(); }
    ctx.restore();
    ctx.restore();
    // collar + tag
    const col = COLLARS.find(c => c.id === collarId && c.need <= best) || COLLARS[0];
    ctx.save(); ctx.translate(16, -6); ctx.rotate(0.9);
    ctx.fillStyle = col.c; ctx.fillRect(-3, -9, 6, 18);
    if (col.id === 'pearl') { for (let i = -7; i <= 7; i += 4.5) ellipse(0, i, 3, 3, '#fffdf7'); ctx.strokeStyle = '#cfc6b4'; ctx.lineWidth = 0.8; for (let i = -7; i <= 7; i += 4.5) { ctx.beginPath(); ctx.arc(0, i, 3, 0, Math.PI * 2); ctx.stroke(); } }
    if (col.id === 'navy') { ctx.fillStyle = '#fff'; for (let i = -6; i <= 6; i += 6) ellipse(0, i, 1.2, 1.2, '#fff'); }
    ctx.restore();
    ellipse(20, 2, 3.5, 3.5, '#ffd23f');
    ctx.restore();
  }

  // Girl following Milky along the ground
  function drawGirl() {
    const skin = '#f6d2b4', skinD = '#e9bf9f', hair = '#e0a33f', hairD = '#b97f24', hairL = '#f3c46d';
    const dr = DRESSES.find(x => x.id === dressId && x.need <= best) || DRESSES[0];
    const hairAcc = (HAIRS.find(x => x.id === hairId && x.need <= best) || HAIRS[0]).id;
    const dress = dr.c, dressD = dr.d, shoe = '#fbfbf7', sole = '#c9c2b8';
    const moving = state !== 'over' || girl.x < 70;
    const ph = girl.run, sw = moving ? Math.sin(ph) * 0.6 : 0;
    const bob = moving ? -Math.abs(Math.sin(ph)) * 4 : 0;
    const worried = state === 'over' && !moving;
    ctx.save(); ctx.translate(girl.x, GROUND + 1);
    ellipse(0, 0, 15, 3.5, 'rgba(0,0,0,.15)');
    ctx.translate(0, bob);
    const limb = (x, y, ang, len, w, col, end) => {
      ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
      ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-w / 2, 0, w, len, w / 2) : ctx.rect(-w / 2, 0, w, len); ctx.fill();
      if (end === 'shoe') { ellipse(2.5, len, 6, 3.4, shoe); ctx.fillStyle = sole; ctx.fillRect(-3.5, len + 2, 12, 1.6); }
      else ellipse(0, len, 2.6, 2.8, col);
      ctx.restore();
    };
    ctx.save(); ctx.translate(-8, -97); ctx.rotate(0.55 + Math.sin(ph * 2) * 0.22 + (moving ? 0.2 : 0));
    ellipse(0, 16, 5.5, 17, hairD); ellipse(1, 14, 3.6, 13, hair); ctx.restore();
    limb(-2, -38, -sw, 35, 5, skinD, 'shoe');
    limb(-1, -76, worried ? 0.15 : sw * 0.8, 27, 4, skinD);
    ctx.fillStyle = dress; ctx.beginPath();
    ctx.moveTo(-6.5, -78); ctx.lineTo(6.5, -78); ctx.lineTo(5, -62); ctx.lineTo(14, -32); ctx.lineTo(-14, -32); ctx.lineTo(-5, -62); ctx.closePath(); ctx.fill();
    ctx.fillStyle = dressD; ctx.fillRect(-5.5, -64, 11, 2.5);
    ctx.beginPath(); ctx.moveTo(-14, -32); ctx.lineTo(14, -32); ctx.lineTo(13, -34.5); ctx.lineTo(-13, -34.5); ctx.fill();
    limb(2, -38, sw, 35, 5, skin, 'shoe');
    limb(2, -76, worried ? -2.6 : -1.15 - sw * 0.45, worried ? 17 : 27, 4, skin);
    ellipse(1, -76, 4.5, 3.2, dress);
    ctx.fillStyle = skin; ctx.fillRect(-2, -86, 5, 9);
    ellipse(-2.5, -94, 10, 10.5, hair);
    ellipse(2.5, -92, 7.5, 8.8, skin);
    ellipse(-0.5, -100.5, 9, 4.2, hair, -0.12);
    ellipse(-4, -102, 4, 1.6, hairL, -0.3);
    ellipse(-6.5, -87, 3.6, 8, hair);
    ellipse(-7.5, -97, 2.2, 2.2, hairD);
    if (hairAcc === 'headband') {
      ctx.strokeStyle = '#ff5d8f'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.ellipse(-0.5, -96, 9.6, 8.6, -0.12, Math.PI * 1.05, Math.PI * 1.9); ctx.stroke(); ctx.lineCap = 'butt';
    } else if (hairAcc === 'daisy') {
      for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ellipse(-7.5 + Math.cos(a) * 3, -101 + Math.sin(a) * 3, 2.2, 2.2, '#ffffff'); }
      ellipse(-7.5, -101, 1.8, 1.8, '#ffd23f');
    } else if (hairAcc === 'sunhat') {
      ellipse(-0.5, -101, 16, 3.6, '#d9ae5c', -0.08);
      ellipse(-1, -104.5, 8.5, 6.5, '#e8c37a', -0.08);
      ctx.fillStyle = '#ff5d8f'; ctx.save(); ctx.translate(-1, -101.8); ctx.rotate(-0.08); ctx.fillRect(-8.4, -2.4, 16.8, 2.6); ctx.restore();
    }
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(4, -96.5); ctx.lineTo(8, -97); ctx.stroke();
    ellipse(6, -93, 1.2, 1.6, '#3a2a35');
    ctx.strokeStyle = '#a0705a'; ctx.lineWidth = 1.2; ctx.beginPath();
    if (worried) ctx.arc(7, -86.5, 1.4, 0, Math.PI * 2); else ctx.arc(6.5, -88, 1.8, 0.3, Math.PI - 0.7);
    ctx.stroke();
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      if (p.kind === 'label') { ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.5)); text(p.text, p.x, p.y, 16, '#ffd23f'); continue; }
      ctx.globalAlpha = Math.max(0, p.life / (p.kind === 'star' ? 0.8 : 0.4));
      if (p.kind === 'puff') ellipse(p.x, p.y, 6, 6, '#fff');
      else { ctx.fillStyle = '#ffd23f'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('★', p.x, p.y); }
    }
    ctx.globalAlpha = 1;
  }

  function text(str, x, y, size, fill = '#fff', stroke = '#3a2a35', align = 'center') {
    ctx.font = `bold ${size}px "Trebuchet MS", system-ui, sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, size / 6); ctx.strokeStyle = stroke; ctx.strokeText(str, x, y);
    ctx.fillStyle = fill; ctx.fillText(str, x, y);
  }
  function plain(str, x, y, size, fill, align = 'center') {
    ctx.font = `bold ${size}px "Trebuchet MS", system-ui, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = fill; ctx.fillText(str, x, y);
  }
  function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

  function panel(x, y, w, h) {
    ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = '#3a2a35'; ctx.lineWidth = 4;
    rrect(x, y, w, h, 20); ctx.fill(); ctx.stroke();
  }

  function drawMedal(m, x, y, r) {
    const M = MEDALS[m];
    ctx.fillStyle = '#e0457a'; ctx.beginPath(); ctx.moveTo(x - r * 0.7, y - r * 2); ctx.lineTo(x - r * 0.1, y - r * 0.6); ctx.lineTo(x - r * 0.9, y - r * 0.6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5ec8ff'; ctx.beginPath(); ctx.moveTo(x + r * 0.7, y - r * 2); ctx.lineTo(x + r * 0.1, y - r * 0.6); ctx.lineTo(x + r * 0.9, y - r * 0.6); ctx.closePath(); ctx.fill();
    ellipse(x, y, r, r, M.d); ellipse(x, y, r * 0.8, r * 0.8, M.c);
    ctx.fillStyle = M.d; ctx.font = `bold ${Math.round(r)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('★', x, y + 1);
  }

  function drawMute() {
    ctx.globalAlpha = 0.85; ellipse(W - 30, 30, 18, 18, 'rgba(58,42,53,.55)'); ctx.globalAlpha = 1;
    ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
    ctx.fillText(muted ? '🔇' : '🔊', W - 30, 31);
  }

  function drawBoard() {
    const s = L();
    // tabs: this week | all time
    [['week', s.week, W / 2 - 132], ['all', s.all, W / 2 + 2]].forEach(([id, label, x]) => {
      const on = lbTab === id;
      ctx.fillStyle = on ? '#ffd23f' : '#efe6da'; rrect(x, TAB_Y, 130, TAB_H, 10); ctx.fill();
      ctx.strokeStyle = '#3a2a35'; ctx.lineWidth = on ? 2.5 : 1.5; ctx.stroke();
      plain(label, x + 65, TAB_Y + TAB_H / 2 + 1, 14, on ? '#3a2a35' : '#7a6670');
    });
    let y0 = 300;
    if (lbMode === 'local') { plain(s.onPhone, W / 2, 292, 11, '#7a6670'); y0 = 308; }
    const list = lbTab === 'week' ? boardWeek : boardAll;
    if (boardStatus === 'loading') return plain(s.loading, W / 2, 340, 16, '#7a6670');
    if (boardStatus === 'error') return plain(s.loadErr, W / 2, 340, 16, '#7a6670');
    if (!list.length) return plain(s.empty, W / 2, 340, 16, '#7a6670');
    list.forEach((row, k) => {
      const y = y0 + k * 24, mine = myEntryId != null && row.id === myEntryId;
      if (mine) { ctx.fillStyle = '#ffe9a8'; rrect(W / 2 - 136, y - 11, 272, 22, 7); ctx.fill(); }
      const c = k === 0 ? '#e0457a' : '#3a2a35';
      plain((k + 1) + '.', W / 2 - 96, y, 16, c, 'right');
      plain(String(row.name).slice(0, 10), W / 2 - 86, y, 16, c, 'left');
      plain(String(row.score), W / 2 + 126, y, 16, c, 'right');
    });
  }

  function drawUI() {
    const s = L();
    if (state === 'play') {
      text(String(score), W / 2, 70, 56);
      if (toast) {
        const k = Math.min(1, toast.t * 4), fade = toast.t > 1.4 ? Math.max(0, 1 - (toast.t - 1.4) / 0.4) : 1;
        ctx.globalAlpha = fade; ctx.save(); ctx.translate(W / 2, 150); ctx.scale(0.6 + 0.4 * k, 0.6 + 0.4 * k);
        drawMedal(toast.medal, 0, -6, 22); text(toast.text, 0, 38, 24, '#ffd23f'); ctx.restore(); ctx.globalAlpha = 1;
      }
    }
    if (state === 'start') {
      text('Milky', W / 2, 120, 62, '#ffd23f');
      text('Hop!', W / 2, 178, 58, '#ff8fab');
      const pulse = 1 + Math.sin(t * 5) * 0.05;
      ctx.save(); ctx.translate(W / 2, H * 0.62); ctx.scale(pulse, pulse);
      text(('ontouchstart' in window) ? s.tapHop : s.tapSpace, 0, 0, 26); ctx.restore();
      text(s.help1, W / 2, H * 0.68, 17, '#fff');
      text(s.help2, W / 2, H * 0.68 + 23, 17, '#fff');
      text(s.help3, W / 2, H * 0.68 + 46, 15, '#ffd23f');
      if (best > 0) text(s.yourBest + best, W / 2, 572, 20, '#ffd23f');
      if (boardAll.length) text(s.topDog + boardAll[0].name + '  ' + boardAll[0].score, W / 2, 600, 17, '#fff');
    }
    if (state === 'over') {
      ctx.globalAlpha = Math.min(1, overT * 3);
      panel(W / 2 - 160, 84, 320, 572);
      text(s.oof, W / 2, 118, 25, '#ff8fab');
      text(s.score, W / 2 - 85, 156, 17, '#3a2a35', '#fff');
      text(String(lastScore), W / 2 - 85, 190, 36, '#fff');
      text(s.best, W / 2 + 85, 156, 17, '#3a2a35', '#fff');
      text(String(best), W / 2 + 85, 190, 36, '#ffd23f');
      const m = medalFor(lastScore);
      if (m >= 0) drawMedal(m, W / 2, 190, 17);
      const flags = [newBest ? s.newBest : '', unlockedNew ? s.newOutfit : ''].filter(Boolean).join('  ');
      if (flags) plain(flags, W / 2, 228, 15, '#e63946');
      ctx.fillStyle = '#3a2a35'; ctx.fillRect(W / 2 - 130, 241, 260, 2);
      drawBoard();
      if (overT > 0.6 && !formOpen) text(s.tryAgain, W / 2, 626, 20, '#fff');
      ctx.globalAlpha = 1;
    }
    drawMute();
  }

  // ---------- loop ----------
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt);
    drawSky(); drawStacks(); drawTreats(); drawGround(); drawGirl(); drawParticles(); drawDog(dog.x, dog.y, dog.rot);
    if (skyT > 1) { ctx.fillStyle = `rgba(20,20,60,${0.18 * (skyT - 1)})`; ctx.fillRect(0, 0, W, H); }
    drawUI();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
